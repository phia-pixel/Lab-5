<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growing Toward Light</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #eaf4e5;
            color: #203b25;
            margin: 0;
            padding: 25px;
        }

        button {
            background-color: #305b36;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        #garden {
            position: relative;
            width: 280px;
            height: 300px;
            margin: 25px auto;
            background-color: #c9e6f2;
            border-bottom: 25px solid #79513a;
            overflow: hidden;
            transition: background-color 1s;
        }

        #plant {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 12px;
            height: 35px;
            margin-left: -6px;
            background-color: #3f823c;
        }

        .leaf {
            position: absolute;
            width: 55px;
            height: 25px;
            background-color: #529647;
        }

        #left-leaf {
            top: 15px;
            right: 8px;
            border-radius: 0 100% 0 100%;
            transform: rotate(20deg);
        }

        #right-leaf {
            top: 40px;
            left: 8px;
            border-radius: 100% 0 100% 0;
            transform: rotate(-20deg);
        }

        #webcam-container {
            margin-top: 20px;
        }

        #label-container {
            margin-top: 10px;
            line-height: 1.8;
        }
    </style>
</head>

<body>
    <h1>Growing Toward Light</h1>

    <p>Show the camera light or darkness to control the plant.</p>

    <button id="start-button" type="button" onclick="init()">
        Start
    </button>

    <p id="status" role="status">Click Start to begin.</p>

    <div id="garden">
        <div id="plant">
            <div class="leaf" id="left-leaf"></div>
            <div class="leaf" id="right-leaf"></div>
        </div>
    </div>

    <div id="webcam-container"></div>
    <div id="label-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script>
        // Replace this with your hosted model URL if needed.
        const MODEL_URL = "./my_model/";

        // These must match your model's class names.
        const LIGHT_CLASS = "squished";
        const DARK_CLASS = "still";

        let model;
        let webcam;
        let labelContainer;

        let plantHeight = 35;
        let lightDetected = false;
        let previousTime = null;

        const plant = document.getElementById("plant");
        const garden = document.getElementById("garden");
        const statusText = document.getElementById("status");
        const startButton = document.getElementById("start-button");

        async function init() {
            startButton.disabled = true;
            statusText.textContent = "Loading the model and camera...";

            try {
                const modelURL = MODEL_URL + "model.json";
                const metadataURL = MODEL_URL + "metadata.json";

                model = await tmImage.load(modelURL, metadataURL);

                // Check that the expected classes exist.
                const classes = model.getClassLabels();

                if (
                    !classes.includes(LIGHT_CLASS) ||
                    !classes.includes(DARK_CLASS)
                ) {
                    throw new Error(
                        "Your model needs classes named " +
                        LIGHT_CLASS + " and " + DARK_CLASS +
                        ". Update the class names in the code if needed."
                    );
                }

                webcam = new tmImage.Webcam(200, 200, true);

                await webcam.setup();
                await webcam.play();

                document.getElementById("webcam-container")
                    .replaceChildren(webcam.canvas);

                labelContainer = document.getElementById("label-container");
                labelContainer.replaceChildren();

                for (let i = 0; i < model.getTotalClasses(); i++) {
                    labelContainer.appendChild(document.createElement("div"));
                }

                startButton.textContent = "Camera running";
                previousTime = null;

                window.requestAnimationFrame(loop);
            } catch (error) {
                if (webcam) {
                    webcam.stop();
                }

                statusText.textContent = "Could not start: " + error.message;
                startButton.disabled = false;
                startButton.textContent = "Try again";
                console.error(error);
            }
        }

        async function loop(time) {
            try {
                webcam.update();
                await predict();

                // Measure elapsed time so growth stays consistent.
                let seconds = 0;

                if (previousTime !== null) {
                    seconds = Math.min((time - previousTime) / 1000, 0.1);
                }

                previousTime = time;

                if (lightDetected && plantHeight < 240) {
                    plantHeight = Math.min(240, plantHeight + 15 * seconds);
                    plant.style.height = plantHeight + "px";
                }

                if (plantHeight >= 240) {
                    statusText.textContent = "Your plant is fully grown!";
                }

                window.requestAnimationFrame(loop);
            } catch (error) {
                webcam.stop();
                statusText.textContent = "Camera or prediction error: " + error.message;
                startButton.disabled = false;
                startButton.textContent = "Try again";
                console.error(error);
            }
        }

        async function predict() {
            const predictions = await model.predict(webcam.canvas);

            lightDetected = false;
            let darkDetected = false;

            for (let i = 0; i < predictions.length; i++) {
                const result = predictions[i];

                labelContainer.children[i].textContent =
                    result.className + ": " +
                    (result.probability * 100).toFixed(0) + "%";

                // Act only when the model is at least 80% confident.
                if (result.className === LIGHT_CLASS &&
                    result.probability >= 0.8) {
                    lightDetected = true;
                }

                if (result.className === DARK_CLASS &&
                    result.probability >= 0.8) {
                    darkDetected = true;
                }
            }

            if (lightDetected) {
                garden.style.backgroundColor = "#c9e6f2";
                statusText.textContent = "Light detected: the plant is growing.";
            } else if (darkDetected) {
                garden.style.backgroundColor = "#25334d";
                statusText.textContent = "Darkness detected: growth has paused.";
            } else {
                statusText.textContent =
                    "Unsure: try showing clearer light or darkness.";
            }
        }
    </script>
</body>
</html>
